name: Production QC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://poonthaidigital.com"
          for i in {1..30}; do
            if curl -fsS "$BASE/sitemap.xml" | grep -q '<loc>https://poonthaidigital.com/invoice-payment-tracker/</loc>' \
              && curl -fsS "$BASE/assets/app.js" | grep -q '4578945050'; then
              echo "Production is reachable with the PDT-IPT-001 release."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready with the PDT-IPT-001 release in time."
          exit 1

      - name: Verify core HTTP and SEO surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://poonthaidigital.com"
          curl -fsS "$BASE/" -o /tmp/home.html
          curl -fsS "$BASE/robots.txt" -o /tmp/robots.txt
          curl -fsS "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsS "$BASE/assets/app.js" -o /tmp/app.js
          test "$(grep -c '<loc>' /tmp/sitemap.xml)" -eq 20
          grep -q 'Sitemap: https://poonthaidigital.com/sitemap.xml' /tmp/robots.txt
          grep -q 'G-0299KE0RD0' /tmp/home.html
          grep -q 'etsy_click' /tmp/app.js
          grep -q 'tool_used' /tmp/app.js
          grep -q 'buildCoffeeChecklist' /tmp/app.js
          grep -q 'calcCleaningSchedule' /tmp/app.js
          grep -q 'calcPrivateChefJob' /tmp/app.js
          grep -q 'calcWasteCost' /tmp/app.js
          grep -q '4578945050' /tmp/app.js
          echo "Core production SEO + analytics checks passed."

      - name: Verify four new tool routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://poonthaidigital.com"
          for path in \
            coffee-shop-opening-closing-checklist \
            cafe-cleaning-schedule-planner \
            private-chef-job-cost-calculator \
            food-waste-cost-calculator; do
            curl -fsS "$BASE/$path/" -o "/tmp/$path.html"
            grep -q 'G-0299KE0RD0' "/tmp/$path.html"
            grep -q '<link rel="canonical"' "/tmp/$path.html"
            grep -q 'application/ld+json' "/tmp/$path.html"
          done
          echo "Four new tool routes are live with GA4, canonical and JSON-LD."

      - name: Verify live invoice product destination
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://poonthaidigital.com"
          curl -fsS "$BASE/invoice-payment-tracker/" -o /tmp/invoice.html
          curl -fsS "$BASE/catalog-status/" -o /tmp/catalog.html
          curl -fsS "$BASE/assets/lead-funnel.js" -o /tmp/lead-funnel.js
          grep -q 'https://www.etsy.com/listing/4578945050' /tmp/invoice.html
          grep -q 'PDT-IPT-001' /tmp/invoice.html
          grep -q 'Digital download' /tmp/invoice.html
          grep -q 'Invoice &amp; Payment Follow-Up Tracker' /tmp/catalog.html
          ! grep -Eq '4561821192|4573789186|4560696421|4561819638|4561793463|4561795303|4569445414' /tmp/lead-funnel.js
          echo "Live invoice destination and reset-safe lead funnel passed."

      - name: Verify APIs, IndexNow key and www redirect
        shell: bash
        run: |
          set -euo pipefail
          KEY="075d7c906278535516f9ad6a0c883a2a"
          BODY="$(curl -fsS "https://poonthaidigital.com/${KEY}.txt")"
          test "$BODY" = "$KEY"
          TOOL_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"tool":"waste_cost","sourcePath":"/production-qc"}' https://poonthaidigital.com/api/tool-use/)"
          test "$TOOL_STATUS" = "204"
          ETSY_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"product":"PDT-IPT-001","sourcePath":"/production-qc","target":"https://www.etsy.com/listing/4578945050"}' https://poonthaidigital.com/api/etsy-click/)"
          test "$ETSY_STATUS" = "204"
          HEADERS="$(curl -sSI https://www.poonthaidigital.com/food-waste-cost-calculator/)"
          printf '%s\n' "$HEADERS" | grep -Eq '^HTTP/[^ ]+ 308'
          printf '%s\n' "$HEADERS" | grep -qi '^location: https://poonthaidigital.com/food-waste-cost-calculator/'
          echo "APIs, IndexNow key + canonical redirect checks passed."
