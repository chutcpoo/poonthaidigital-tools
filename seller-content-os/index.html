<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Content OS</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f8fb;color:#172337;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px}h1{color:#173b80}.err{color:#9b1c1c;white-space:pre-wrap}</style></head><body><div class="box"><h1>Seller Content OS</h1><p id="status">กำลังโหลด Phase 8…</p></div><script>(async()=>{const s=document.getElementById('status');try{if(!('DecompressionStream' in window))throw new Error('เบราว์เซอร์นี้ไม่รองรับการเปิดแอปเวอร์ชันนี้ กรุณาใช้ Chrome, Edge, Safari หรือ Firefox เวอร์ชันล่าสุด');const r=await fetch('./app.dat',{cache:'no-store'});if(!r.ok)throw new Error('โหลดไฟล์แอปไม่สำเร็จ ('+r.status+')');const ds=new DecompressionStream('gzip');const html=await new Response(r.body.pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){s.className='err';s.textContent='เปิดแอปไม่สำเร็จ: '+e.message}})();</script></body></html>
